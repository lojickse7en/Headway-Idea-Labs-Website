<!-- @dsCard group="Components" viewport="700x230" subtitle="Gradient CTA, variants, sizes, and the arrow link" name="Actions" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:20px;font-family:var(--hw-font-body);background:#fff;color:var(--hw-ink)}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.lbl{font-family:var(--hw-font-head);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#9AA6B4;margin:0 0 9px}
.dark{background:var(--hw-gradient-navy);border-radius:14px;padding:18px}</style>
</head><body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const NEEDS = ["Button","LinkArrow"];
function findNS(){
  for (const k of Object.keys(window)) {
    try { const v = window[k];
      if (v && typeof v === 'object' && NEEDS.every(n => typeof v[n] === 'function')) return v;
    } catch(e){}
  }
  return null;
}
const NS = findNS() || {};
const { Button, LinkArrow } = NS;

function Card(){
  return (
    <div style={{display:'grid',gap:16}}>
      <div><p className="lbl">Primary &middot; sizes</p>
        <div className="row"><Button size="lg">Schedule a Consultation</Button><Button>Book a Call</Button><Button size="sm">Learn more</Button></div></div>
      <div><p className="lbl">On dark &middot; outline pairs with primary</p>
        <div className="dark"><div className="row"><Button>Download Overview</Button><Button variant="outline">Inquire About Partnership</Button></div></div></div>
      <div><p className="lbl">Secondary &middot; slate &middot; disabled</p>
        <div className="row"><LinkArrow>Book a Discovery Call</LinkArrow><Button variant="slate" size="sm">Sign Up</Button><Button disabled>Disabled</Button></div></div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Card />);
</script></body></html>
