<!-- @dsCard group="Components" viewport="700x260" subtitle="Input states and the footer newsletter block" name="Forms" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:20px;font-family:var(--hw-font-body);background:#fff;color:var(--hw-ink)}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.lbl{font-family:var(--hw-font-head);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#9AA6B4;margin:0 0 9px}
.dark{background:var(--hw-gradient-navy);border-radius:14px;padding:18px}</style>
</head><body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const NEEDS = ["Input","NewsletterForm"];
function findNS(){
  for (const k of Object.keys(window)) {
    try { const v = window[k];
      if (v && typeof v === 'object' && NEEDS.every(n => typeof v[n] === 'function')) return v;
    } catch(e){}
  }
  return null;
}
const NS = findNS() || {};
const { Input, NewsletterForm } = NS;

function Card(){
  return (
    <div style={{display:'grid',gap:18}}>
      <div><p className="lbl">Input &middot; light</p>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
          <Input placeholder="Your name" /><Input type="email" placeholder="Work email" />
        </div></div>
      <div><p className="lbl">Newsletter &middot; on the footer brown</p>
        <div style={{background:'var(--hw-footer)',borderRadius:14,padding:'22px 24px'}}>
          <NewsletterForm blurb="Stay ahead with expert insights, success stories, and monthly strategies on running top-tier accelerators." />
        </div></div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Card />);
</script></body></html>
