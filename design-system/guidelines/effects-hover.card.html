<!-- @dsCard group="Brand" viewport="700x175" subtitle="Lift 4px, light-blue fill and border" name="Card hover" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 20px;font-family:var(--hw-font-body);background:#fff;color:var(--hw-ink)}</style>
</head><body><div style="display:flex;gap:16px">
   <div style="flex:1;background:#fff;border:1px solid var(--hw-line);border-radius:14px;padding:20px;box-shadow:var(--hw-shadow-card)">
     <div style="width:44px;height:44px;border-radius:50%;background:var(--hw-orange-bg);margin-bottom:14px"></div>
     <div style="font-family:var(--hw-font-head);font-weight:600;font-size:15px;color:var(--hw-navy)">Rest</div></div>
   <div style="flex:1;background:var(--hw-hover-fill);border:1px solid var(--hw-hover-border);border-radius:14px;padding:20px;box-shadow:var(--hw-shadow-card-hover);transform:translateY(-4px)">
     <div style="width:44px;height:44px;border-radius:50%;background:#DBE9FB;margin-bottom:14px"></div>
     <div style="font-family:var(--hw-font-head);font-weight:600;font-size:15px;color:var(--hw-navy)">Hover</div></div></div></body></html>
