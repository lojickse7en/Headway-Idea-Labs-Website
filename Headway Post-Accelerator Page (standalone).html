  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

lid rgba(255,255,255,.7);}\n  .btn-outline:hover{background:rgba(255,255,255,.12);border-color:#fff;}\n\n  /* ---------------- HEADER ---------------- */\n  header.site{\n    position:sticky;top:0;z-index:50;background:#fff;\n    border-bottom:1px solid var(--line);\n  }\n  .nav{display:flex;align-items:center;justify-content:space-between;height:78px;}\n  .logo img{height:46px;width:auto;}\n  .nav-links{display:flex;align-items:center;gap:30px;list-style:none;margin:0;padding:0;}\n  .nav-links > li{position:relative;}\n  .nav-links > li > a{\n    font-family:var(--head);font-weight:500;font-size:15px;color:#33414f;\n    display:flex;align-items:center;gap:5px;padding:28px 0;transition:color .15s;\n  }\n  .nav-links > li:hover > a, .nav-links > li.active > a{color:var(--orange);}\n  .caret{width:9px;height:9px;fill:none;stroke:currentColor;stroke-width:2;}\n  .dropdown{\n    position:absolute;top:72px;left:-14px;min-width:240px;background:#fff;\n    border:1px solid var(--line);border-radius:10px;padding:8px;\n    box-shadow:0 18px 40px -14px rgba(14,42,77,.22);\n    opacity:0;visibility:hidden;transform:translateY(8px);transition:.18s ease;\n  }\n  .nav-links > li:hover .dropdown{opacity:1;visibility:visible;transform:translateY(0);}\n  .dropdown a{display:block;padding:10px 14px;border-radius:7px;font-size:14.5px;color:#3a4654;font-family:var(--body);}\n  .dropdown a:hover{background:#f4f8fd;color:var(--orange);}\n  .login-btn{background-image:var(--btn-grad);color:#fff;font-family:var(--head);font-weight:600;font-size:14.5px;padding:10px 28px;border-radius:6px;transition:.15s;}\n  .login-btn:hover{box-shadow:var(--btn-glow);}\n  .hamburger{display:none;background:none;border:none;cursor:pointer;padding:8px;}\n  .hamburger span{display:block;width:24px;height:2.4px;background:var(--navy);margin:5px 0;border-radius:2px;transition:.25s;}\n\n  /* ---------------- HERO ---------------- */\n  .hero{\n    position:relative;overflow:hidden;\n    background:#fef7f0 url(\" 2>\n      <p>Mentors and speakers get practical speaking guides. Founders get the actual operating steps behind investor-ready tasks, not vague direction.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"wt-grid\">\n      <div class=\"wt\"><span class=\"wt-dot\"><\u002Fspan>Investor narrative<\u002Fdiv>\n      <div class=\"wt\"><span class=\"wt-dot\"><\u002Fspan>Capital roadmap<\u002Fdiv>\n      <div class=\"wt\"><span class=\"wt-dot\"><\u002Fspan>Milestone tracking<\u002Fdiv>\n      <div class=\"wt\"><span class=\"wt-dot\"><\u002Fspan>Financial clarity<\u002Fdiv>\n      <div class=\"wt\"><span class=\"wt-dot\"><\u002Fspan>Accountability rhythm<\u002Fdiv>\n      <div class=\"wt\"><span class=\"wt-dot\"><\u002Fspan>Pitch proficiency<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ================= END-TO-END JOURNEY ================= -->\n<section class=\"pad journey-sec\" data-comment-anchor=\"86f5a8c219-section\">\n  <div class=\"container journey-inner\" data-comment-anchor=\"62835035db-div\">\n    <div class=\"journey-aside\" data-comment-anchor=\"1b83d3b317-div\">\n      <span class=\"label\">How it all connects<\u002Fspan>\n      <h2 data-comment-anchor=\"d4d5dabb0c-h2\">Where the post-accelerator step fits in the founder journey.<\u002Fh2>\n      <p>The model layers into your current programs rather than replacing what already works—guiding local founders, outside founders, and alumni through one clear path from pre-accelerator to post-program.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"steps\">\n      <div class=\"step\"><div class=\"sn\">01<\u002Fdiv><div><h3>Pre-Accelerator Foundation<\u002Fh3><p>Founder vision, strategic clarity, market logic, and readiness diagnostics before founders enter deeper programming.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div class=\"step\"><div class=\"sn\">02<\u002Fdiv><div><h3>Accelerator Embedded Curriculum<\u002Fh3><p>Mentorship, structured worksheets, milestone tracking, and execution accountability aligned to the accelerator’s existing goals.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div class=\"step featured\"><span class=\"you-are-here\">You are here<\u002Fspan><div class=\"sn\">03<\u002Fdiv><div><h3>Post-Accelerator Investor Readiness<\u002Fh3><p>Investor narrative construction, capital sequencing, milestone-to-capital alignment, and disciplined follow-through after the cohort finishes.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div class=\"step\"><div class=\"sn\">04<\u002Fdiv><div><h3>Ecosystem Investor Connection<\u002Fh3><p>Founders are prepared to enter aligned investor conversations with stronger confidence, clearer evidence, and a more credible capital roadmap.<\u002Fp><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ================= BUILT FOR ================= -->\n<section class=\"pad builtfor\">\n  <div class=\"container\">\n    <div class=\"center-head\" data-comment-anchor=\"a52cb940b2-div\">\n      <span class=\"label\">Who it’s built for<\u002Fspan>\n      <h2>Designed for accelerators, not one-off consulting.<\u002Fh2>\n      <p>Headway works through innovation hubs, incubators, university programs, economic development agencies, and mission-aligned startup ecosystems.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"bf-cards\">\n      <div class=\"bf-card\">\n        <h4><svg class=\"ws-ic\" viewBox=\"0 0 24 24\"><path d=\"M5 13l4 4L19 7\"><\u002Fpath><\u002Fsvg>Structured founder development<\u002Fh4>\n        <p>Repeatable curriculum creates consistency across cohorts and makes it easier for mentors to stay aligned.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"bf-card\">\n        <h4><svg class=\"ws-ic\" viewBox=\"0 0 24 24\"><path d=\"M5 13l4 4L19 7\"><\u002Fpath><\u002Fsvg>Lower program burden<\u002Fh4>\n        <p>Standardized tools reduce the amount of founder management that falls back on program teams.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ================= WHY THIS EXISTS ================= -->\n<section class=\"pad missing\" data-comment-anchor=\"742cfb7b11-section\">\n  <div class=\"container\">\n    <div class=\"split-head\">\n      <div>\n        <span class=\"label\">Why this exists<\u002Fspan>\n        <h2>The missing layer after <b>demo day.<\u002Fb><\u002Fh2>\n      <\u002Fdiv>\n      <p class=\"intro\">Accelerators often tell founders what to do. Headway helps founders learn how to do the work with the strategic clarity, maturity, and proficiency that investors expect.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"mcards\">\n      <div class=\"mcard\">\n        <div class=\"mchip navy\"><svg viewBox=\"0 0 24 24\"><path d=\"M7 17 17 7M9 7h8v8\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <h3>Programming continuity<\u002Fh3>\n        <p>Support does not end when a cohort ends. The series keeps founders, mentors, and ecosystem partners moving through one connected readiness path.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"mcard\">\n        <div class=\"mchip teal\"><svg viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"8\"><\u002Fcircle><circle cx=\"12\" cy=\"12\" r=\"3.2\"><\u002Fcircle><\u002Fsvg><\u002Fdiv>\n        <h3>Founder transformation<\u002Fh3>\n        <p>The focus is not just the idea or pitch deck. The goal is to develop founders into purpose-driven business strategists who can lead fundable companies.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"mcard\">\n        <div class=\"mchip orange\"><svg viewBox=\"0 0 24 24\"><path d=\"M12 2v20\"><\u002Fpath><path d=\"M16.5 6.5C16.5 4.7 14.4 4 12 4S7.5 4.9 7.5 7.2 9.7 10 12 10.4s4.5 1.1 4.5 3.4S14.4 17 12 17s-4.5-.8-4.5-2.7\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <h3>Capital discipline<\u002Fh3>\n        <p>Founders build milestone-based capital plans, financial clarity, investor narratives, and accountability systems before they enter serious investor conversations.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- =====
